<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Casa · Home Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20260503a" />
</head>
<body>
  <!-- Background atmosférico -->
  <div class="bg">
    <div class="bg__blob bg__blob--lime"></div>
    <div class="bg__blob bg__blob--cyan"></div>
    <div class="bg__blob bg__blob--violet"></div>
    <div class="bg__grain"></div>
  </div>

  <div class="app">
    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="sidebar__brand" title="Casa">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
        </div>
      </div>

      <nav class="sidebar__nav" id="nav">
        <button class="nav-item is-active" data-route="home" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-route="lights" title="Luzes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.7.6 1 1.4 1 2.3h6c0-.9.3-1.7 1-2.3A7 7 0 0 0 12 2z"/></svg>
          <span>Luzes</span>
        </button>
        <button class="nav-item" data-route="climate" title="Clima">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 1 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
          <span>Clima</span>
        </button>
        <button class="nav-item" data-route="security" title="Segurança">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3z"/></svg>
          <span>Segurança</span>
        </button>
        <button class="nav-item" data-route="media" title="Mídia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8"/><path d="M12 18v4"/></svg>
          <span>Mídia</span>
        </button>
        <button class="nav-item nav-item--accent" data-route="baby" title="Babytracker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M5 21c1-4 5-6 7-6s6 2 7 6"/></svg>
          <span>Esther</span>
        </button>
      </nav>

      <div class="sidebar__foot">
        <button class="nav-item" title="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="avatar" title="Wendell">W</div>
      </div>
    </aside>

    <!-- ========== MAIN ========== -->
    <main class="main">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar__left">
          <h1 class="topbar__title" id="pageTitle">Boa noite, Wendell</h1>
          <p class="topbar__sub" id="pageSub">Sua casa está tranquila — 22°C, tudo seguro.</p>
        </div>

        <div class="topbar__center">
          <div class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" placeholder="Buscar dispositivos, cenas, cômodos…" />
            <kbd>⌘K</kbd>
          </div>
        </div>

        <div class="topbar__right">
          <button class="icon-btn" id="themeBtn" title="Modo (claro / escuro / noturno)" data-theme-mode="normal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="icon-btn" id="scenesBtn" title="Cenas">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2.4 5 5.6.8-4 4 1 5.6L12 14.8 6.9 17.4l1-5.6-4-4 5.6-.8L12 2z"/></svg>
          </button>
          <button class="icon-btn" id="notifBtn" title="Notificações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
            <span class="dot" id="notifDot" hidden></span>
          </button>
          <div class="weather-chip">
            <span id="wxIcon" class="weather-chip__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a4 4 0 0 0 0-8 6 6 0 0 0-11.7 1.5A4.5 4.5 0 0 0 6.5 20H17z"/></svg>
            </span>
            <span><strong id="wxTemp">24°</strong> · <span id="wxLocation">Taubaté</span></span>
          </div>
        </div>
      </header>

      <!-- VIEWS -->
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- Templates -->
  <template id="tpl-home"></template>

  <!-- Modal universal (popup de entidade) -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__sheet" role="dialog" aria-modal="true" id="modalSheet"></div>
  </div>

  <!-- FAB Babytracker -->
  <button class="fab" id="fabBaby" title="Ir para Babytracker" aria-label="Babytracker">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4"/><path d="M5 21c1-4 5-6 7-6s6 2 7 6"/></svg>
    <span class="fab__pulse" id="fabPulse" hidden></span>
  </button>

  <!-- Screensaver -->
  <div class="screensaver" id="screensaver" aria-hidden="true">
    <div class="ss__time" id="ssTime">--:--</div>
    <div class="ss__date" id="ssDate"></div>
    <div class="ss__row">
      <div class="ss__chip"><span id="ssTemp">--°</span> casa</div>
      <div class="ss__chip" id="ssBaby">Berço livre</div>
    </div>
    <div class="ss__hint">toque para acordar</div>
  </div>

  <script src="./app.js?v=20260503a" type="module"></script>
</body>
</html>
